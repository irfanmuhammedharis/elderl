name: elderl
description: Senior Citizen Assistance App - A Flutter mobile application for seniors, caregivers, and family members.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.4.9

  # Firebase - using compatible versions
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_database: ^10.5.7
  firebase_messaging: ^14.9.4
  firebase_storage: ^11.7.7
  firebase_analytics: ^10.10.7
  firebase_crashlytics: ^3.5.7

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.19.0
  go_router: ^13.0.0
  geolocator: ^10.1.0
  url_launcher: ^6.2.0
  connectivity_plus: ^6.0.3  # For cross-platform connectivity monitoring

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  mocktail: ^1.0.1

flutter:
  uses-material-design: true
